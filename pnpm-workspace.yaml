packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@eloqnt/config@0.1.0'
  - '@eloqnt/format-json@0.1.0'
  - '@eloqnt/format-po@0.1.0'
  - '@next/env@15.5.25'
  - '@next/eslint-plugin-next@15.5.25'
  - '@next/swc-darwin-arm64@15.5.25'
  - '@next/swc-darwin-x64@15.5.25'
  - '@next/swc-linux-arm64-gnu@15.5.25'
  - '@next/swc-linux-arm64-musl@15.5.25'
  - '@next/swc-linux-x64-gnu@15.5.25'
  - '@next/swc-linux-x64-musl@15.5.25'
  - '@next/swc-win32-arm64-msvc@15.5.25'
  - '@next/swc-win32-x64-msvc@15.5.25'
  - eslint-config-next@15.5.25
  - icu-minify@4.14.2
  - next-intl-swc-plugin-extractor@4.14.2
  - next-intl@4.14.2
  - next@15.5.25
  - use-intl@4.14.2
  - globals@17.12.0
