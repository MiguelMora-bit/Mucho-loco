name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Unit tests only (Vitest en los 3 SPA/Next.js + Jest en el backend con
      # Prisma mockeado, sin DB real) — ninguno necesita Postgres ni un User
      # Pool de Cognito vivo. Los e2e (Playwright/Jest contra DB real) quedan
      # fuera de CI mientras la infra de AWS esté destruida (ver "Nota
      # operativa" en el CLAUDE.md raíz) y no corren aquí todavía.
      - run: pnpm test
